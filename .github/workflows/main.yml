name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build interics.dev.metaphi.in
        working-directory: ./interics.dev.metaphi.in
        run: |
          npm ci
          npm run build
          cat > dist/.htaccess <<'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: Build interics.metaphi.in
        working-directory: ./interics.metaphi.in
        run: |
          npm ci
          npm run build
          cat > dist/.htaccess <<'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: Deploy dev site
        run: |
          rsync -av --delete ./interics.dev.metaphi.in/dist/ /var/www/interics.dev.metaphi.in/

      - name: Deploy prod site
        run: |
          rsync -av --delete ./interics.metaphi.in/dist/ /var/www/interics.metaphi.in/
      - name: apache reload
        run: systemctl reload apache2
