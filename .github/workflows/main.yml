name: Frontend Deploy - interics.metaphi.in

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      PATH: /root/.nvm/versions/node/v22.21.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner user
        run: |
          whoami
          id
          echo "HOME=$HOME"

      - name: Verify Node and npm
        run: |
          node -v
          npm -v

      - name: Ensure deployment directory exists
        run: |
          mkdir -p /var/www/interics.metaphi.in

      - name: Copy files to deployment directory
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            ./ /var/www/interics.metaphi.in/

      - name: Install dependencies
        working-directory: /var/www/interics.metaphi.in
        run: |
          npm install

      - name: Build application
        working-directory: /var/www/interics.metaphi.in
        run: |
          npm run build

      - name: Verify build
        working-directory: /var/www/interics.metaphi.in
        run: |
          if [ -d "dist" ]; then
            echo "Build successful. dist directory found."
            ls -lah dist
          else
            echo "ERROR: dist directory not found after build."
            exit 1
          fi
